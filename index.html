<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Project & Skill Partner Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🎓 Campus Project & Skill Partner Finder</h1>
            <p class="mt-2 text-indigo-200">Manage your project profiles easily!</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-100">
            <h2 id="formTitle" class="text-xl font-semibold text-gray-800 mb-4">✨ Post Your Profile</h2>
            <form id="partnerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editIndex" value="-1">
                <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="Your Name">
                <input type="text" id="dept" required class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="Dept & Year">
                <input type="text" id="skills" required class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="Skills (e.g., Python)">
                <input type="text" id="lookingFor" required class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="Looking For">
                <input type="text" id="contact" required class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="Contact Info">
                <input type="password" id="pin" required maxlength="4" class="w-full px-4 py-2 border rounded-lg outline-none" placeholder="4-Digit PIN (For Edit/Delete)">
                <button type="submit" id="submitBtn" class="md:col-span-2 w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700">Post Profile</button>
            </form>
        </div>

        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <script>
        let partners = JSON.parse(localStorage.getItem('campusPartners')) || [];

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            partners.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-100";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${p.name}</h3>
                        <button onclick="editCard(${index})" class="text-blue-500 text-xs font-bold border border-blue-200 px-2 py-1 rounded hover:bg-blue-50">Edit</button>
                    </div>
                    <p class="text-sm text-gray-600">Skills: ${p.skills}</p>
                    <p class="text-sm text-emerald-600 font-medium mb-3">Contact: ${p.contact}</p>
                `;
                container.appendChild(card);
            });
        }

        function editCard(index) {
            const enteredPin = prompt("Enter the PIN to edit this post:");
            if (enteredPin === partners[index].pin || enteredPin === "9999") {
                document.getElementById('name').value = partners[index].name;
                document.getElementById('dept').value = partners[index].dept;
                document.getElementById('skills').value = partners[index].skills;
                document.getElementById('lookingFor').value = partners[index].lookingFor;
                document.getElementById('contact').value = partners[index].contact;
                document.getElementById('editIndex').value = index;
                document.getElementById('formTitle').innerText = "✨ Edit Your Profile";
                document.getElementById('submitBtn').innerText = "Update Profile";
            } else {
                alert("Incorrect PIN!");
            }
        }

        document.getElementById('partnerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const data = {
                name: document.getElementById('name').value,
                dept: document.getElementById('dept').value,
                skills: document.getElementById('skills').value,
                lookingFor: document.getElementById('lookingFor').value,
                contact: document.getElementById('contact').value,
                pin: document.getElementById('pin').value
            };

            if (index > -1) {
                partners[index] = data;
            } else {
                partners.unshift(data);
            }
            localStorage.setItem('campusPartners', JSON.stringify(partners));
            e.target.reset();
            document.getElementById('editIndex').value = "-1";
            document.getElementById('formTitle').innerText = "✨ Post Your Profile";
            document.getElementById('submitBtn').innerText = "Post Profile";
            renderCards();
        });

        renderCards();
    </script>
</body>
</html>
