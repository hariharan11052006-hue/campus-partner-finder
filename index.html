<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Project & Skill Partner Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🎓 Campus Project & Skill Partner Finder</h1>
            <p class="mt-2 text-indigo-200">Live Campus Directory powered by Firebase!</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Registration Form Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-100">
            <h2 id="formTitle" class="text-xl font-semibold text-gray-800 mb-4">✨ Post Your Profile</h2>
            <form id="partnerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editId" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., Mukesh">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Department & Year</label>
                    <input type="text" id="dept" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., CSE - 3rd Year">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Skills</label>
                    <input type="text" id="skills" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., Python, UI Design, React">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Looking For / Requirement</label>
                    <input type="text" id="lookingFor" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., Need UI Designer for IoT Project">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact Info (Phone / Email)</label>
                    <input type="text" id="contact" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., 9876543210">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">4-Digit PIN (For Edit/Delete)</label>
                    <input type="password" id="pin" required maxlength="4" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g., 1234">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">
                        Post Profile
                    </button>
                </div>
            </form>
        </div>

        <!-- Search & Filter Section -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="🔍 Search by name, skill, or department..." class="w-full px-4 py-3 border rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
        </div>

        <!-- Partner Cards Grid -->
        <h2 class="text-xl font-semibold text-gray-800 mb-4">👥 Live Student Directory</h2>
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Cards will appear here -->
        </div>

    </main>

    <!-- Firebase Logic (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmF1wF8v7Y617RxTFg__6aX2UTiLGy2B0",
            authDomain: "campus-partner-finder.firebaseapp.com",
            projectId: "campus-partner-finder",
            storageBucket: "campus-partner-finder.firebasestorage.app",
            messagingSenderId: "313607087813",
            appId: "1:313607087813:web:e80b6edb4a16daa954b2ac",
            measurementId: "G-81C117W27M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let partners = [];
        const form = document.getElementById('partnerForm');
        const cardsContainer = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');

        // Real-time listener with clean array reset
        onSnapshot(collection(db, "partners"), (snapshot) => {
            partners = []; // Clean array to avoid duplicates
            snapshot.forEach((docSnap) => {
                partners.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderCards(searchInput.value);
        });

        function renderCards(filterText = '') {
            cardsContainer.innerHTML = '';
            
            const filtered = partners.filter(p => 
                (p.name && p.name.toLowerCase().includes(filterText.toLowerCase())) ||
                (p.skills && p.skills.toLowerCase().includes(filterText.toLowerCase())) ||
                (p.dept && p.dept.toLowerCase().includes(filterText.toLowerCase()))
            );

            if(filtered.length === 0) {
                cardsContainer.innerHTML = `<p class="text-gray-500 md:col-span-2 text-center py-4">No results found...</p>`;
                return;
            }

            filtered.forEach((p) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg text-gray-800">${p.name || 'No Name'}</h3>
                            <div class="flex items-center gap-2">
                                <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-medium">${p.dept || ''}</span>
                                <button onclick="window.editCard('${p.id}')" class="text-blue-500 text-xs font-semibold border border-blue-200 px-2 py-1 rounded hover:bg-blue-50">Edit</button>
                                <button onclick="window.deleteCard('${p.id}')" class="text-red-500 text-xs font-semibold border border-red-200 px-2 py-1 rounded hover:bg-red-50">Delete</button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 mb-2"><strong>Skills:</strong> ${p.skills || ''}</p>
                        <p class="text-sm text-gray-700 bg-gray-50 p-2.5 rounded-lg border border-gray-100 mb-2"><strong>Looking For:</strong> ${p.lookingFor || ''}</p>
                        <p class="text-sm text-emerald-600 font-medium mb-4">📞 Contact: ${p.contact || ''}</p>
                    </div>
                    <a href="tel:${p.contact}" class="block text-center bg-indigo-50 text-indigo-600 text-sm font-semibold py-2 rounded-lg hover:bg-indigo-100 transition">
                        Call / Connect
                    </a>
                `;
                cardsContainer.appendChild(card);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const newData = {
                name: document.getElementById('name').value,
                dept: document.getElementById('dept').value,
                skills: document.getElementById('skills').value,
                lookingFor: document.getElementById('lookingFor').value,
                contact: document.getElementById('contact').value,
                pin: document.getElementById('pin').value
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "partners", editId), newData);
                    alert("Profile updated successfully!");
                } else {
                    await addDoc(collection(db, "partners"), newData);
                    alert("Profile posted successfully!");
                }
                resetForm();
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        window.editCard = function(id) {
            const p = partners.find(item => item.id === id);
            if (!p) return;
            const enteredPin = prompt("Enter the 4-digit PIN to edit this post:");
            const MASTER_PIN = "9999";

            if (enteredPin === p.pin || enteredPin === MASTER_PIN) {
                document.getElementById('name').value = p.name;
                document.getElementById('dept').value = p.dept;
                document.getElementById('skills').value = p.skills;
                document.getElementById('lookingFor').value = p.lookingFor;
                document.getElementById('contact').value = p.contact;
                document.getElementById('pin').value = p.pin;
                document.getElementById('editId').value = p.id;
                document.getElementById('formTitle').innerText = "✨ Edit Your Profile";
                document.getElementById('submitBtn').innerText = "Update Profile";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (enteredPin !== null) {
                alert("Incorrect PIN!");
            }
        };

        window.deleteCard = async function(id) {
            const p = partners.find(item => item.id === id);
            if (!p) return;
            const enteredPin = prompt("Enter the 4-digit PIN to delete this post:");
            const MASTER_PIN = "9999";

            if (enteredPin === p.pin || enteredPin === MASTER_PIN)

 {
                if (confirm("Are you sure you want to delete this post?")) {
                    try {
                        await deleteDoc(doc(db, "partners", id));
                        alert("Post deleted successfully!");
                    } catch (error) {
                        alert("Error deleting: " + error.message);
                    }
                }
            } else if (enteredPin !== null) {
                alert("Incorrect PIN!");
            }
        };

        function resetForm() {
            form.reset();
            document.getElementById('editId').value = "";
            document.getElementById('formTitle').innerText = "✨ Post Your Profile";
            document.getElementById('submitBtn').innerText = "Post Profile";
        }

        searchInput.addEventListener('input', (e) => {
            renderCards(e.target.value);
        });
    </script>
</body>
</html>
