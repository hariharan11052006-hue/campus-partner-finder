<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Project & Skill Partner Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-fixed min-h-screen relative" style="background-image: url('college.jpg');">

    <!-- Background Transparent Overlay -->
    <div class="absolute inset-0 bg-black/50 min-h-screen z-0"></div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10 flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-indigo-900/80 backdrop-blur-md text-white py-5 shadow-md border-b border-indigo-700/50">
            <div class="container mx-auto px-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🎓</span>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold">Campus Project & Skill Partner Finder</h1>
                        <p class="text-indigo-200 text-xs md:text-sm">Live Campus Directory powered by Firebase!</p>
                    </div>
                </div>
                <div id="userInfo" class="hidden items-center gap-3">
                    <span id="displayName" class="font-medium text-sm text-indigo-100"></span>
                    <button onclick="logout()" class="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded transition">Logout</button>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">

            <!-- 1. Login Page -->
            <div id="loginPage" class="flex justify-center items-center h-full pt-12">
                <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Welcome to Campus Connect</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Your Name / Email</label>
                            <input type="text" id="loginEmail" required class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white" placeholder="e.g., Hariharan">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="loginPass" required class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white" placeholder="Password">
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                                <input type="checkbox" id="isAdminCheck" class="accent-indigo-600 w-4 h-4">
                                Login as Admin (View Only)
                            </label>
                        </div>
                        <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                            Login / Enter
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. Domain/Action Selection Page -->
            <div id="selectionPage" class="hidden pt-12 text-center">
                <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 md:p-10 w-full max-w-lg mx-auto border border-white/20">
                    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-4">👋 Welcome, <span id="welcomeName" class="text-indigo-600"></span>!</h2>
                    <p class="text-gray-600 mb-8 text-base">What would you like to do today?</p>
                    
                    <div id="actionButtonsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button id="findPartnerBtn" onclick="proceedTo('search')" class="bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 p-6 rounded-2xl text-indigo-700 transition transform hover:-translate-y-1">
                            <span class="block text-4xl mb-3">🔍</span>
                            <span class="block text-lg font-bold" id="findPartnerText">Find a Partner</span>
                            <span class="block text-xs text-gray-500 mt-1">Search student profiles</span>
                        </button>
                        <button id="postBtnCard" onclick="proceedTo('post')" class="bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 p-6 rounded-2xl text-emerald-700 transition transform hover:-translate-y-1">
                            <span class="block text-4xl mb-3">✨</span>
                            <span class="block text-lg font-bold">Post Profile</span>
                            <span class="block text-xs text-gray-500 mt-1">Share your project skills</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3. Main App Section -->
            <div id="mainAppSection" class="hidden">
                <!-- Registration Form Section -->
                <div id="postFormSection" class="hidden bg-white/90 backdrop-blur-md rounded-xl shadow-xl p-6 mb-8 border border-white/20">
                    <div class="flex justify-between items-start mb-4">
                        <h2 id="formTitle" class="text-xl font-semibold text-gray-800">✨ Post Your Profile</h2>
                        <button onclick="backToSelection()" class="text-sm font-medium text-indigo-600 hover:underline">&larr; Back to Menu</button>
                    </div>
                    
                    <form id="partnerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="hidden" id="editId" value="">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                            <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80" placeholder="e.g., Mukesh">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                            <select id="dept" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80">
                                <option value="">Select Department</option>
                                <option value="CSE">CSE</option>
                                <option value="IT">IT</option>
                                <option value="ECE">ECE</option>
                                <option value="EEE">EEE</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                                <option value="AI & DS">AI & DS</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Your Skills</label>
                            <input type="text" id="skills" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80" placeholder="e.g., Python, React">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Looking For / Requirement</label>
                            <input type="text" id="lookingFor" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80" placeholder="e.g., UI Designer for IoT">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contact Info (Phone / Email)</label>
                            <input type="text" id="contact" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80" placeholder="e.g., 9876543210">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">4-Digit PIN (For Edit/Delete)</label>
                            <input type="password" id="pin" required maxlength="4" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/80" placeholder="e.g., 1234">
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition shadow-md">
                                Post Profile
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Search Bar & Filters -->
                <div id="searchFiltersSection" class="hidden mb-6">
                    <div class="flex items-center gap-2 mb-4">
                        <input type="text" id="searchInput" placeholder="🔍 Search by name, skill..." class="flex-grow px-4 py-3 border rounded-xl shadow-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/90 backdrop-blur-md">
                        <button onclick="backToSelection()" class="bg-white/90 backdrop-blur-md px-4 py-3 rounded-xl shadow-lg border border-white/20 text-indigo-700 font-semibold hover:bg-white transition">🏠 Menu</button>
                    </div>

                    <!-- Department Filter Buttons -->
                    <div class="flex flex-wrap gap-2 justify-center">
                        <button onclick="filterDept('All')" class="dept-btn px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-full shadow transition">All</button>
                        <button onclick="filterDept('CSE')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">CSE</button>
                        <button onclick="filterDept('IT')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">IT</button>
                        <button onclick="filterDept('ECE')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">ECE</button>
                        <button onclick="filterDept('EEE')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">EEE</button>
                        <button onclick="filterDept('Mechanical')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">Mechanical</button>
                        <button onclick="filterDept('AI & DS')" class="dept-btn px-4 py-2 bg-white/80 text-gray-800 text-sm font-semibold rounded-full shadow hover:bg-white transition">AI & DS</button>
                    </div>
                </div>

                <!-- Partner Cards Grid -->
                <h2 id="directoryTitle" class="hidden text-xl font-semibold text-white mb-4 drop-shadow-md">👥 Live Student Directory</h2>
                <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Cards will appear here -->
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Logic & App Routing -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmF1wF8v7Y617RxTFg__6aX2UTiLGy2B0",
            authDomain: "campus-partner-finder.firebaseapp.com",
            projectId: "campus-partner-finder",
            storageBucket: "campus-partner-finder.firebasestorage.app",
            messagingSenderId: "313607087813",
            appId: "1:313607087813:web:e80b6edb4a16daa954b2ac",
            measurementId: "G-81C117W27M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let partners = [];
        let selectedDept = 'All';
        let currentUserRole = null; 
        let currentUserName = null;

        const loginPage = document.getElementById('loginPage');
        const selectionPage = document.getElementById('selectionPage');
        const mainAppSection = document.getElementById('mainAppSection');
        const userInfo = document.getElementById('userInfo');
        const displayName = document.getElementById('displayName');
        const postFormSection = document.getElementById('postFormSection');
        const searchFiltersSection = document.getElementById('searchFiltersSection');
        const directoryTitle = document.getElementById('directoryTitle');
        const form = document.getElementById('partnerForm');
        const cardsContainer = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');
        const postBtnCard = document.getElementById('postBtnCard');
        const findPartnerBtn = document.getElementById('findPartnerBtn');
        const findPartnerText = document.getElementById('findPartnerText');

        // 1. Login Handler
        window.handleLogin = function() {
            const nameInput = document.getElementById('loginEmail').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const isAdmin = document.getElementById('isAdminCheck').checked;

            if(!nameInput || !passInput) {
                alert("Please enter both name and password!");
                return;
            }

            if(isAdmin) {
                if(nameInput === "admin" && passInput === "admin123") {
                    currentUserRole = 'admin';
                    currentUserName = "Administrator (View Only)";
                } else {
                    alert("Invalid Admin Credentials! (Use admin / admin123)");
                    return;
                }
            } else {
                currentUserRole = 'student';
                currentUserName = nameInput;
            }

            loginPage.classList.add('hidden');
            selectionPage.classList.remove('hidden');
            userInfo.classList.remove('hidden');
            displayName.innerText = `👤 ${currentUserName}`;
            document.getElementById('welcomeName').innerText = currentUserName;

            // Update based on Role
            if(currentUserRole === 'admin') {
                postBtnCard.style.display = 'none';
                // Update the "Find a Partner" card text to "Profiles Uploaded"
                findPartnerText.innerText = "Profiles Uploaded";
            } else {
                postBtnCard.style.display = 'block';
                // Reset the text for students
                findPartnerText.innerText = "Find a Partner";
            }
        }

        // 2. Proceed to Action
        window.proceedTo = function(action) {
            if(action === 'post' && currentUserRole === 'admin') {
                alert("Admins
